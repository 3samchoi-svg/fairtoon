# Supabase 무료 프로젝트 휴면 방지
# 무료 티어는 일정 기간 요청이 없으면 프로젝트가 일시정지된다.
# 매일 1회 공개 읽기 요청을 보내 깨어 있게 한다.
name: keepalive

on:
  schedule:
    - cron: "17 3 * * *"   # 매일 03:17 UTC (KST 12:17)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (public read)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wrvllrxwgautewttvffe.supabase.co/rest/v1/platforms?select=key&limit=1" \
            -H "apikey: sb_publishable_wuImInmyi0WtmCQKetBBhw_QJI-AZAY")
          echo "HTTP $code"
          test "$code" = "200"
