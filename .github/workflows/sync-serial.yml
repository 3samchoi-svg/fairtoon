name: 연재작 동기화

# 매일 07:57(KST) — 인기 순위 갱신(07:37)보다 20분 뒤다.
# 순위에 새로 오른 작품이 그날 안에 카탈로그에 들어오게 하려는 순서다.
# GitHub 크론은 UTC라 22:57 UTC로 적는다. 정각을 피한 이유는 rankings.yml 참조.
#
# 이 워크플로는 DB에 직접 쓰지 않는다. Supabase Edge Function 하나를 부를 뿐이다.
# 전권 키는 GitHub에 두지 않는다 — 자세한 이유는 supabase/functions/README.md.
on:
  schedule:
    - cron: "57 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "확인만 하고 DB는 건드리지 않음"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 동기화 함수 호출
        env:
          TOKEN: ${{ secrets.SUPABASE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SUPABASE_SYNC_TOKEN 이 없다. 리포 Settings > Secrets 에 넣어야 한다."
            echo "설정 방법: supabase/functions/README.md"
            exit 1
          fi

          URL="https://wrvllrxwgautewttvffe.supabase.co/functions/v1/sync-serial"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            URL="$URL?dry=1"
            echo "확인 모드 — DB에 쓰지 않는다"
          fi

          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 600 \
            -X POST "$URL" -H "x-sync-token: $TOKEN")

          echo "HTTP $code"
          echo "--- 함수 응답 ---"
          cat response.json
          echo

          # 207은 일부 실패다. 무엇이 실패했는지 위 응답의 errors 에 남는다.
          if [ "$code" = "200" ] || [ "$code" = "207" ]; then
            exit 0
          fi
          exit 1
