name: 인기 순위 갱신

# 매일 07:00(KST) — GitHub 크론은 UTC라 22:00 UTC로 적는다.
# 손으로 돌리고 싶을 때는 Actions 탭에서 "Run workflow"를 누르면 된다.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 3사 랭킹 수집
        run: python3 scripts/collect_rankings.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/rankings.json; then
            echo "순위 변동 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "fairtoon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rankings.json
          git commit -m "인기 순위 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push
